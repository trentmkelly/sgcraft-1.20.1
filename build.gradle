plugins {
    id 'java'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[7.0,8)'
    id 'net.minecraftforge.renamer' version '1.1.8+'
}

version = mod_version
group = mod_group_id
base.archivesName = 'SGCraft'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: minecraft_version

    runs {
        configureEach {
            workingDir.convention layout.projectDirectory.dir('run')
        }
        register('client') {
        }
        register('server') {
            args '--nogui'
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    maven {
        name = 'SquidDev'
        url = 'https://maven.squiddev.cc'
        content { includeGroup 'cc.tweaked' }
    }
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:$minecraft_version-$forge_version")
    // Only the pure-Java core API is needed: the peripheral capability is looked up by type token.
    compileOnly "cc.tweaked:cc-tweaked-$minecraft_version-core-api:$cct_version"
}

tasks.named('processResources', ProcessResources) {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.property('replaceProperties', replaceProperties)
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar) {
    manifest {
        attributes([
                'Specification-Title'   : mod_id,
                'Specification-Vendor'  : mod_authors,
                'Specification-Version' : '1',
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_authors
        ])
    }
    archiveClassifier = 'unobfuscated'
}

renamer.mappings.from minecraft.dependency.toSrgFile

renamer.classes(tasks.named('jar', Jar)) {
    archiveClassifier = ''
}

tasks.named('build') { dependsOn 'renameJar' }

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
